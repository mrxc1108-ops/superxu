<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私行产品白名单预约系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0ede8;--surface:#fff;--surface2:#f8f6f2;--surface3:#f3f0ea;
  --border:#ddd8cf;--border2:#c8c2b8;
  --ink:#1c1a17;--ink2:#5a5650;--ink3:#8c877f;
  --gold:#b8860b;--gold2:#d4a017;--gold-bg:#fdf8ee;--gold-border:#e8d48a;
  --red:#c0392b;--green:#1a7a40;--blue:#1a5fa0;
  --shadow:0 2px 12px rgba(28,26,23,.08);--shadow2:0 4px 24px rgba(28,26,23,.13);
  --r:6px;--r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

/* ── TOPBAR ── */
.topbar{background:var(--ink);color:#fff;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--gold);}
.topbar-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;letter-spacing:2px;}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:12px;color:#aaa8a0;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#2ecc71;display:inline-block;margin-right:5px;}
.status-dot.closed{background:#e74c3c;}
.status-dot.waiting{background:#f39c12;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.status-dot:not(.closed):not(.waiting){animation:blink 2s infinite;}
.btn-topbar{font-size:11px;padding:4px 12px;background:transparent;border:1px solid #555;color:#ccc;border-radius:3px;cursor:pointer;letter-spacing:1px;transition:.2s;}
.btn-topbar:hover{border-color:var(--gold);color:var(--gold);}

/* ── BANNER ── */
.banner{padding:9px 24px;text-align:center;font-size:13px;display:none;}
.banner.closed{background:#fdf0ef;border-bottom:1px solid #f5c6c2;color:var(--red);}
.banner.waiting{background:#fffbef;border-bottom:1px solid #f0e07a;color:#7a6000;}

/* ── PAGES ── */
.page{display:none;max-width:1160px;margin:0 auto;padding:28px 20px 60px;}
.page.active{display:block;animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── PAGE HEADER ── */
.ph{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.ph h1{font-family:'Noto Serif SC',serif;font-size:21px;font-weight:700;letter-spacing:2px;}
.ph-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3);background:var(--surface2);border:1px solid var(--border);padding:3px 10px;border-radius:3px;letter-spacing:.5px;}
.tag.gold{color:var(--gold);border-color:var(--gold-border);background:var(--gold-bg);}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow);overflow:hidden;}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-header h2{font-size:14px;font-weight:600;letter-spacing:1px;color:var(--ink);}
.card-body{padding:24px 20px;}

/* ── PAGE 1: IDENTITY ── */
.identity-wrap{max-width:480px;margin:60px auto 0;}
.identity-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:40px 40px 32px;box-shadow:var(--shadow2);text-align:center;}
.identity-card .logo{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:700;letter-spacing:3px;margin-bottom:6px;}
.identity-card .subtitle{font-size:12px;color:var(--ink3);letter-spacing:1px;margin-bottom:32px;}
.identity-card .field-label{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;text-align:left;}
.btn-confirm{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-family:'Noto Sans SC',sans-serif;font-weight:500;letter-spacing:2px;cursor:pointer;transition:.2s;margin-top:20px;}
.btn-confirm:hover{background:var(--gold);}

/* ── PRODUCT SECTION ── */
.product-section{margin-bottom:32px;}
.product-header{background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r2) var(--r2) 0 0;display:flex;align-items:center;justify-content:space-between;}
.product-header .pname{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:700;letter-spacing:2px;}
.product-header .pidx{font-family:'JetBrains Mono',monospace;font-size:11px;color:#aaa8a0;letter-spacing:1px;}
.product-body{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r2) var(--r2);overflow:hidden;}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead tr{background:#2c2a26;color:#fff;}
.data-table thead th{padding:10px 7px;font-weight:500;letter-spacing:.3px;white-space:nowrap;text-align:left;border-right:1px solid rgba(255,255,255,.07);}
.data-table thead th:last-child{border-right:none;}
.data-table thead th .req{color:var(--gold2);margin-left:1px;}
.data-table tbody tr{border-bottom:1px solid var(--border);}
.data-table tbody tr:last-child{border-bottom:none;}
.data-table tbody tr:hover{background:#fdfbf7;}
.data-table tbody td{padding:6px 5px;vertical-align:middle;}
.data-table tbody td.rn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3);text-align:center;width:28px;}

/* ── CELL INPUTS ── */
.ci{width:100%;padding:5px 7px;border:1px solid transparent;border-radius:4px;font-size:12px;font-family:'Noto Sans SC',sans-serif;color:var(--ink);background:transparent;transition:.15s;}
.ci:focus{outline:none;border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 2px rgba(184,134,11,.1);}
.ci.err{border-color:var(--red)!important;background:#fff8f8!important;}
.ci[type=number]{min-width:68px;}
.ci[type=date]{min-width:116px;}

/* ── DROPDOWN ── */
.dc{position:relative;}
.di{width:100%;padding:5px 20px 5px 7px;border:1px solid transparent;border-radius:4px;font-size:12px;font-family:'Noto Sans SC',sans-serif;color:var(--ink);background:transparent;cursor:pointer;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.di:focus{outline:none;border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 2px rgba(184,134,11,.1);}
.di.err{border-color:var(--red)!important;background:#fff8f8!important;}
.dc::after{content:'▾';position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;font-size:10px;}
.dl{position:absolute;top:calc(100% + 2px);left:0;min-width:160px;background:var(--surface);border:1.5px solid var(--gold-border);border-radius:var(--r);box-shadow:var(--shadow2);z-index:300;max-height:200px;overflow-y:auto;display:none;}
.dl.open{display:block;}
.dl-s{padding:6px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
.dl-s input{width:100%;padding:4px 7px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:'Noto Sans SC',sans-serif;outline:none;}
.dl-s input:focus{border-color:var(--gold);}
.dli{padding:6px 10px;font-size:12px;cursor:pointer;transition:.1s;white-space:nowrap;}
.dli:hover{background:var(--gold-bg);}
.dli.sel{background:var(--gold-bg);color:var(--gold);font-weight:500;}
.dli.oth{color:var(--blue);font-style:italic;}

/* ── OTHER ROW ── */
.other-row{background:var(--gold-bg)!important;}
.other-row td{padding:3px 5px!important;}
.other-lbl{font-size:11px;color:var(--ink3);padding:0 4px;}

/* ── RADIO ── */
.rc{display:flex;gap:5px;}
.rc label{display:flex;align-items:center;gap:2px;font-size:12px;cursor:pointer;padding:4px 7px;border:1px solid var(--border);border-radius:3px;transition:.15s;white-space:nowrap;}
.rc label:has(input:checked){background:var(--gold-bg);border-color:var(--gold);color:var(--gold);font-weight:500;}
.rc input{display:none;}

/* ── TABLE FOOTER ── */
.tfoot{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:var(--surface2);}
.btn-add{display:flex;align-items:center;gap:5px;padding:6px 14px;background:var(--surface);border:1.5px dashed var(--border2);border-radius:var(--r);font-size:12px;color:var(--ink2);cursor:pointer;transition:.2s;}
.btn-add:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg);}
.rc-count{font-size:11px;color:var(--ink3);}

/* ── SUBMIT BAR ── */
.submit-bar{margin-top:22px;display:flex;align-items:center;justify-content:flex-end;gap:12px;}
.btn-submit{padding:11px 36px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-family:'Noto Sans SC',sans-serif;font-weight:500;letter-spacing:2px;cursor:pointer;transition:.2s;}
.btn-submit:hover:not(:disabled){background:var(--gold);}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;}
.sh{font-size:12px;color:var(--ink3);}

/* ── ADMIN PANEL ── */
.admin-overlay{display:none;position:fixed;inset:0;background:rgba(28,26,23,.65);z-index:600;align-items:center;justify-content:center;}
.admin-overlay.open{display:flex;}
.admin-panel{background:var(--surface);border-radius:var(--r2);padding:30px 32px;width:500px;max-width:94vw;box-shadow:var(--shadow2);max-height:90vh;overflow-y:auto;}
.admin-panel h2{font-family:'Noto Serif SC',serif;font-size:17px;margin-bottom:20px;}
.admin-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink3);margin-top:-4px;}
.af{margin-bottom:16px;}
.af label{font-size:11px;letter-spacing:1.5px;color:var(--ink3);display:block;margin-bottom:5px;text-transform:uppercase;}
.af input,.af textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;font-family:'Noto Sans SC',sans-serif;outline:none;transition:.2s;}
.af input:focus,.af textarea:focus{border-color:var(--gold);}
.af textarea{resize:vertical;min-height:72px;}
.ab{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;}
.btn-p{padding:8px 18px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-size:12px;cursor:pointer;letter-spacing:.5px;}
.btn-d{padding:8px 18px;background:var(--red);color:#fff;border:none;border-radius:var(--r);font-size:12px;cursor:pointer;}
.btn-s{padding:8px 18px;background:var(--surface2);color:var(--ink2);border:1px solid var(--border);border-radius:var(--r);font-size:12px;cursor:pointer;}
.ast{font-size:11px;color:var(--ink3);margin-top:8px;min-height:16px;}
.adivider{border:none;border-top:1px solid var(--border);margin:18px 0;}

/* product list in admin */
.prod-list{margin-top:6px;}
.prod-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;}
.prod-item span{flex:1;font-size:13px;}
.prod-item button{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:15px;padding:2px 5px;}
.prod-item button:hover{color:var(--red);}
.prod-add-row{display:flex;gap:7px;margin-top:8px;}
.prod-add-row input{flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;font-family:'Noto Sans SC',sans-serif;outline:none;}
.prod-add-row input:focus{border-color:var(--gold);}
.prod-add-row button{padding:7px 14px;background:var(--gold);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-size:13px;}

/* ── TOAST ── */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:var(--r);font-size:13px;letter-spacing:.5px;z-index:9999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;border-left:3px solid var(--gold);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{border-left-color:#2ecc71;}
.toast.err{border-left-color:var(--red);}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-title">📋 私行产品白名单预约系统</div>
  <div class="topbar-right">
    <span><span class="status-dot" id="sDot"></span><span id="sTxt">收集中</span></span>
    <span id="tTime" style="font-family:'JetBrains Mono',monospace;font-size:11px;"></span>
    <button class="btn-topbar" onclick="openAdmin()">管理员</button>
  </div>
</div>

<!-- BANNERS -->
<div class="banner closed" id="bannerClosed">⚠ 今日数据收集已结束，无法提交新数据</div>
<div class="banner waiting" id="bannerWaiting">⏳ 管理员尚未配置今日产品名称，请稍候再填写 &nbsp;<button onclick="manualRefresh()" style="font-size:12px;padding:3px 10px;border:1px solid #b8860b;background:#fff;color:#b8860b;border-radius:4px;cursor:pointer;">刷新</button></div>

<!-- PAGE 1: 选择身份 -->
<div class="page active" id="page1">
  <div class="identity-wrap">
    <div class="identity-card">
      <div class="logo">白名单预约</div>
      <div class="subtitle">请先确认您的身份，每日仅可选择一次</div>
      <div class="field-label">客户经理</div>
      <div class="dc" id="p1DropWrap">
        <input type="text" class="di" id="p1Display" placeholder="搜索或选择姓名…" readonly onclick="toggleDrop('p1Drop')" autocomplete="off">
        <div class="dl" id="p1Drop">
          <div class="dl-s"><input type="text" placeholder="搜索姓名…" id="p1Search" oninput="filterDrop('p1Drop',this.value)"></div>
          <div id="p1Items"></div>
        </div>
        <input type="hidden" id="p1Val">
      </div>
      <div id="p1OtherWrap" style="display:none;margin-top:14px;text-align:left;background:var(--gold-bg);border:1.5px solid var(--gold-border);border-radius:var(--r);padding:14px;">
        <div style="font-size:12px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;font-weight:500;">▶ 请填写您的真实姓名</div>
        <input type="text" id="p1OtherInput" placeholder="输入真实姓名，按确认后提交"
          style="width:100%;padding:10px 12px;border:1.5px solid var(--gold-border);border-radius:var(--r);font-size:14px;font-family:'Noto Sans SC',sans-serif;outline:none;transition:.2s;box-sizing:border-box;background:#fff;"
          oninput="document.getElementById('p1Val').value=this.value.trim()"
          onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--gold-border)'">
      </div>
      <button class="btn-confirm" onclick="confirmIdentity()">确认身份，进入填写 →</button>
    </div>
  </div>
</div>

<!-- PAGE 2: 填写数据 -->
<div class="page" id="page2">
  <div class="ph">
    <h1>私行产品白名单预约</h1>
    <div class="ph-meta">
      <span class="tag" id="p2Date"></span>
      <span class="tag gold" id="p2Manager"></span>
      <span class="tag" id="p2Deadline">截止 17:00</span>
    </div>
  </div>
  <!-- 产品区域容器 -->
  <div id="productsArea"></div>
  <div class="submit-bar">
    <span class="sh" id="submitHint"></span>
    <button class="btn-submit" id="submitBtn" onclick="doSubmit()">提 交 数 据</button>
  </div>
</div>

<!-- ADMIN OVERLAY -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <button class="admin-close" onclick="closeAdmin()">×</button>
    <h2>管理员控制台</h2>
    <div class="af">
      <label>管理员密码</label>
      <input type="password" id="aPwd" placeholder="输入密码后操作">
    </div>
    <hr class="adivider">
    <div class="af">
      <label>今日产品名称（填写后客户经理才能填报）</label>
      <div class="prod-list" id="prodList"></div>
      <div class="prod-add-row">
        <input type="text" id="newProdInput" placeholder="输入产品名称，按添加">
        <button onclick="adminAddProduct()">＋ 添加</button>
      </div>
      <p style="font-size:11px;color:var(--ink3);margin-top:5px;">每个产品将对应 Excel 中的一个 Sheet</p>
    </div>
    <div class="ab">
      <button class="btn-p" onclick="adminSaveProducts()">保存产品配置</button>
    </div>
    <hr class="adivider">
    <div class="af">
      <label>汇总邮件发至</label>
      <input type="email" id="aEmail" placeholder="your@email.com">
    </div>
    <div class="af">
      <label>Google Apps Script URL</label>
      <input type="text" id="aGasUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="ab">
      <button class="btn-p" onclick="adminSaveConfig()">保存配置</button>
      <button class="btn-d" onclick="adminForceClose()">立即结束收集 + 发送</button>
      <button class="btn-s" onclick="adminReopen()">重新开放</button>
    </div>
    <p class="ast" id="aSt"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════
const CFG = {
  adminPwd: '888888',
  cutoffHour: 17,
  clearHour: 23,
  // ★ 把你的 Apps Script URL 填在这里（部署后替换）
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwHvOAPtOGeGrBClx7TRWrkcMvN_7czE8_cQ8fQtxzfD7kKfAGhNlh3jlr97N8ftzs/exec',
};

// 读取 GAS URL：优先用管理员面板里手动保存的，否则用 CFG 内置值
function getGasUrl(){
  return localStorage.getItem('gasUrl') || CFG.GAS_URL || '';
}

// ═══════════════════════════════════════════════════
//  LISTS
// ═══════════════════════════════════════════════════
const DEF_BRANCHES = [
  '黄浦支行','徐汇支行','静安支行','虹口支行','杨浦支行',
  '长宁支行','松江支行','闵行支行','虹桥支行','南汇支行',
  '惠南支行','奉贤支行','青浦支行','营业部','陆家嘴支行',
  '浦东支行','金山支行','临港支行','宝山支行','嘉定支行',
  '张江支行','其他机构'
];
const DEF_MANAGERS = [
  '陈璐','张瑛','李瑾','翁晨','袁佳蝶','颜文娴','贡宇卓','王思思','朱静','纪承嘉',
  '张乐敏','虞诗磊','瞿燕','顾珍宝','顾飞鸿','郭梦媛','沈家露','周林霖','闫虹宇','屠吉铭',
  '季凌晓','姜帅','张蓉','姚霞','丁淼奇','潘成笺','徐艺诚','任智文','谢冰冰','汪晏平',
  '李卓一','吴怡菁','吴君','徐迎凯','毛文叶','迟珊珊','黎宇航','王超群','张子君','翁春梅',
  '乔红','孙焕君','董粟','刘恬恬','崔源源','朱卫','俞婧祎','胡佩心','伏景伊','张煜程',
  '李燕琳','乔烨','宋夏燕','虞可欣','唐燕青','茅一欣','阮佳琪','朱星星','密海燕','王澜霖',
  '顾雨潇','陈思贤','黄文涛','王雪悦','孙文','吴琼江','其他人员'
];
function getBranches(){
  const ex=JSON.parse(ls('extraBranches')||'[]');
  const b=[...DEF_BRANCHES];
  const i=b.indexOf('其他机构');
  b.splice(i,0,...ex);
  return b;
}
function getManagers(){
  const ex=JSON.parse(ls('extraManagers')||'[]');
  const b=[...DEF_MANAGERS];
  const i=b.indexOf('其他人员');
  b.splice(i,0,...ex);
  return b;
}

// ═══════════════════════════════════════════════════
//  STORAGE HELPERS
// ═══════════════════════════════════════════════════
function ls(k,v){if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}
function lsj(k,v){if(v===undefined){const r=ls(k);return r?JSON.parse(r):null;}ls(k,JSON.stringify(v));}
function todayKey(){return new Date().toLocaleDateString('zh-CN');}

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let currentManager='';
let isClosed=false;
let products=[]; // [{name,id}]
let rowCounters={}; // productId -> counter

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  checkAndClearOldData();
  loadProducts();
  updateClock();
  setInterval(updateClock,15000);
  setInterval(checkSchedule,30000);
  setInterval(fetchProductsFromServer,30000);
  buildP1Dropdown();
  checkIdentityLock();
  // Load saved GAS url into admin panel
  const su=ls('gasUrl')||CFG.GAS_URL;
  if(su) document.getElementById('aGasUrl').value=su;
  const se=ls('adminEmail');
  if(se) document.getElementById('aEmail').value=se;
});

function checkAndClearOldData(){
  // Clear data from previous day
  const lastDate=ls('dataDate');
  const today=todayKey();
  if(lastDate && lastDate!==today){
    // Remove all row data keys
    Object.keys(localStorage).filter(k=>k.startsWith('rows_')).forEach(k=>localStorage.removeItem(k));
    // Remove identity lock if different day
    ls('identityLockDate','');
    ls('identityLockName','');
    // Remove closed flag
    ls('closedDate','');
    // Remove products
    ls('productsDate','');
    lsj('todayProducts',[]);
    products=[];
  }
  ls('dataDate',today);
  // Schedule 23:00 auto-clear
  scheduleAutoClear();
}

function scheduleAutoClear(){
  const now=new Date();
  const clear=new Date(now);
  clear.setHours(CFG.clearHour,0,0,0);
  if(clear<=now) return; // already past
  const ms=clear-now;
  setTimeout(()=>{
    Object.keys(localStorage).filter(k=>k.startsWith('rows_')||k==='todayProducts'||k==='productsDate').forEach(k=>localStorage.removeItem(k));
    products=[];
    ls('closedDate',todayKey());
    setClosed(true);
  },ms);
}

function checkSchedule(){
  const now=new Date();
  const h=now.getHours();
  if(h>=CFG.cutoffHour && !isClosed && ls('closedDate')!==todayKey()){
    const prods=lsj('todayProducts')||[];
    if(prods.length>0){
      triggerSend('auto');
    }
  }
  if(h>=CFG.clearHour){
    setClosed(true);
  }
}

// ═══════════════════════════════════════════════════
//  PRODUCTS
// ═══════════════════════════════════════════════════
function loadProducts(){
  const today=todayKey();
  const pd=ls('productsDate');
  if(pd===today){
    products=lsj('todayProducts')||[];
  } else {
    products=[];
  }
  updateBanners();
  fetchProductsFromServer();
}

function fetchProductsFromServer(){
  const url=getGasUrl();
  if(!url){ console.log('[产品刷新] 未配置GAS URL'); return; }
  console.log('[产品刷新] 请求URL:', url);
  const callbackName = 'gasCallback_'+Date.now();
  const script = document.createElement('script');
  window[callbackName] = function(data){
    console.log('[产品刷新] 收到数据:', JSON.stringify(data));
    delete window[callbackName];
    try{document.body.removeChild(script);}catch(e){}
    if(data && data.products){
      if(data.products.length>0){
        products = data.products;
        lsj('todayProducts', products);
        ls('productsDate', todayKey());
        updateBanners();
        if(currentManager && document.getElementById('page2').classList.contains('active')){
          const hadProds = document.querySelectorAll('.product-section').length;
          if(hadProds !== products.length){ rowCounters={}; buildProductsArea(); }
        }
        console.log('[产品刷新] 成功，产品数:', products.length);
      } else {
        console.log('[产品刷新] 今日无产品配置');
      }
    }
  };
  script.onerror = function(e){
    console.log('[产品刷新] JSONP请求失败', e);
    delete window[callbackName];
    try{document.body.removeChild(script);}catch(ex){}
  };
  script.src = url + '?callback=' + callbackName + '&t=' + Date.now();
  console.log('[产品刷新] script.src:', script.src);
  document.body.appendChild(script);
}

function manualRefresh(){
  console.log('[手动刷新] 开始');
  fetchProductsFromServer();
  showToast('正在刷新产品配置…');
}

function updateBanners(){
  const closed=ls('closedDate')===todayKey();
  const hasProds=products.length>0;
  document.getElementById('bannerClosed').style.display=closed?'block':'none';
  document.getElementById('bannerWaiting').style.display=(!closed&&!hasProds&&currentManager)?'block':'none';
  const dot=document.getElementById('sDot');
  const txt=document.getElementById('sTxt');
  if(closed){dot.className='status-dot closed';txt.textContent='已截止';}
  else if(!hasProds){dot.className='status-dot waiting';txt.textContent='待配置';}
  else{dot.className='status-dot';txt.textContent='收集中';}
  // update submit button
  const btn=document.getElementById('submitBtn');
  if(btn) btn.disabled=closed||!hasProds;
  // rebuild products area if on page2
  if(currentManager && document.getElementById('page2').classList.contains('active')){
    buildProductsArea();
  }
}

// ═══════════════════════════════════════════════════
//  CLOCK
// ═══════════════════════════════════════════════════
function updateClock(){
  const now=new Date();
  document.getElementById('tTime').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const days=['日','一','二','三','四','五','六'];
  const ds=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;
  const d2=document.getElementById('p2Date');
  if(d2) d2.textContent=ds;
}

// ═══════════════════════════════════════════════════
//  DROPDOWN HELPERS
// ═══════════════════════════════════════════════════
function buildP1Dropdown(){
  const items=document.getElementById('p1Items');
  items.innerHTML='';
  getManagers().forEach(m=>{
    const d=document.createElement('div');
    d.className='dli'+(m==='其他人员'?' oth':'');
    d.textContent=m;
    d.onclick=()=>{
      document.getElementById('p1Display').value=m;
      document.getElementById('p1Drop').classList.remove('open');
      if(m==='其他人员'){
        document.getElementById('p1Val').value='';
        document.getElementById('p1OtherWrap').style.display='block';
        document.getElementById('p1OtherInput').value='';
        setTimeout(()=>{
          document.getElementById('p1OtherInput').focus();
          document.getElementById('p1OtherWrap').scrollIntoView({behavior:'smooth',block:'nearest'});
        },80);
      } else {
        document.getElementById('p1Val').value=m;
        document.getElementById('p1OtherWrap').style.display='none';
      }
    };
    items.appendChild(d);
  });
}

function toggleDrop(id){
  const dl=document.getElementById(id);
  const was=dl.classList.contains('open');
  document.querySelectorAll('.dl').forEach(l=>l.classList.remove('open'));
  if(!was){
    dl.classList.add('open');
    const s=dl.querySelector('.dl-s input');
    if(s) setTimeout(()=>s.focus(),30);
  }
}

function filterDrop(dlId,val){
  document.getElementById(dlId).querySelectorAll('.dli').forEach(item=>{
    item.style.display=item.textContent.includes(val)?'':'none';
  });
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.dc')&&!e.target.closest('.dropdown-container'))
    document.querySelectorAll('.dl').forEach(l=>l.classList.remove('open'));
});

// ═══════════════════════════════════════════════════
//  PAGE 1 → PAGE 2
// ═══════════════════════════════════════════════════
function checkIdentityLock(){
  const today=todayKey();
  const lockDate=ls('identityLockDate');
  const lockName=ls('identityLockName');
  if(lockDate===today && lockName){
    currentManager=lockName;
    goPage2();
  }
}

function confirmIdentity(){
  const val=document.getElementById('p1Val').value;
  if(!val){showToast('请先选择客户经理姓名','err');return;}
  // Lock identity for today
  ls('identityLockDate',todayKey());
  ls('identityLockName',val);
  currentManager=val;
  goPage2();
}

function goPage2(){
  document.getElementById('page1').classList.remove('active');
  document.getElementById('page2').classList.add('active');
  document.getElementById('p2Manager').textContent=currentManager;
  updateClock();
  updateBanners();
  buildProductsArea();
}

// ═══════════════════════════════════════════════════
//  PRODUCTS AREA
// ═══════════════════════════════════════════════════
function buildProductsArea(){
  const area=document.getElementById('productsArea');
  area.innerHTML='';
  if(products.length===0){
    area.innerHTML='<div style="padding:40px;text-align:center;color:var(--ink3);font-size:13px;">请等待管理员配置今日产品名称后再填写</div>';
    return;
  }
  products.forEach((prod,idx)=>{
    const sec=document.createElement('div');
    sec.className='product-section';
    sec.id='prodsec_'+prod.id;
    sec.innerHTML=`
      <div class="product-header">
        <span class="pname">${prod.name}</span>
        <span class="pidx">产品 ${idx+1} / ${products.length}</span>
      </div>
      <div class="product-body">
        <table class="data-table" id="tbl_${prod.id}">
          <thead><tr>
            <th style="width:28px">#</th>
            <th style="min-width:95px">机构<span class="req">*</span></th>
            <th style="min-width:85px">客户经理<span class="req">*</span></th>
            <th style="min-width:105px">客户号<span class="req">*</span></th>
            <th style="min-width:75px">客户姓名<span class="req">*</span></th>
            <th style="min-width:75px">现在AUM<br><small style="opacity:.7;font-weight:400">（万元）</small><span class="req">*</span></th>
            <th style="min-width:75px">预约金额<br><small style="opacity:.7;font-weight:400">（万元）</small><span class="req">*</span></th>
            <th style="min-width:75px">购买后AUM<br><small style="opacity:.7;font-weight:400">（万元）</small><span class="req">*</span></th>
            <th style="min-width:65px">是否新资金<span class="req">*</span></th>
            <th style="min-width:110px">认购时间</th>
            <th style="min-width:110px">备注</th>
            <th style="width:30px"></th>
          </tr></thead>
          <tbody id="tbody_${prod.id}"></tbody>
        </table>
        <div class="tfoot">
          <button class="btn-add" onclick="addRow('${prod.id}')">＋ 添加行</button>
          <span class="rc-count" id="rcount_${prod.id}"></span>
        </div>
      </div>`;
    area.appendChild(sec);

    // Init rows
    if(!rowCounters[prod.id]) rowCounters[prod.id]=0;
    const saved=lsj('rows_'+currentManager+'_'+prod.id+'_'+todayKey())||[];
    if(saved.length>0){
      saved.forEach(r=>addRow(prod.id,r));
    } else {
      for(let i=0;i<5;i++) addRow(prod.id);
    }
    updateRcount(prod.id);
  });
}

// ═══════════════════════════════════════════════════
//  ROW MANAGEMENT
// ═══════════════════════════════════════════════════
function addRow(pid,data=null){
  rowCounters[pid]=(rowCounters[pid]||0)+1;
  const n=rowCounters[pid];
  const uid=`${pid}_${n}`;
  const tbody=document.getElementById('tbody_'+pid);
  if(!tbody) return;
  const tr=document.createElement('tr');
  tr.id='row_'+uid;
  tr.dataset.uid=uid;
  tr.dataset.pid=pid;
  tr.innerHTML=buildRowHTML(uid,pid,data);
  tbody.appendChild(tr);
  wireRow(uid,pid);
  updateRcount(pid);
}

function buildRowHTML(uid,pid,d){
  const branches=getBranches();
  const managers=getManagers();
  const v=d||{};
  const isNewV=v.isNew||'';
  const bOpts=branches.map(b=>`<div class="dli${b==='其他机构'?' oth':''}" data-v="${b}" onclick="selCell('branch','${uid}','${b}')">${b}</div>`).join('');
  const mOpts=managers.map(m=>`<div class="dli${m==='其他人员'?' oth':''}" data-v="${m}" onclick="selCell('manager','${uid}','${m}')">${m}</div>`).join('');
  return `
  <td class="rn">${uid.split('_').pop()}</td>
  <td style="min-width:95px;">
    <div class="dc">
      <input type="text" class="di" id="branchD_${uid}" value="${v.branch||''}" placeholder="选择机构" readonly onclick="toggleDrop('branchDL_${uid}')" autocomplete="off">
      <div class="dl" id="branchDL_${uid}">
        <div class="dl-s"><input type="text" placeholder="搜索…" oninput="filterDrop('branchDL_${uid}',this.value)"></div>
        <div>${bOpts}</div>
      </div>
      <input type="hidden" id="branch_${uid}" value="${v.branch||''}">
    </div>
  </td>
  <td style="min-width:85px;">
    <div class="dc">
      <input type="text" class="di" id="managerD_${uid}" value="${v.manager||''}" placeholder="选择经理" readonly onclick="toggleDrop('managerDL_${uid}')" autocomplete="off">
      <div class="dl" id="managerDL_${uid}">
        <div class="dl-s"><input type="text" placeholder="搜索…" oninput="filterDrop('managerDL_${uid}',this.value)"></div>
        <div>${mOpts}</div>
      </div>
      <input type="hidden" id="manager_${uid}" value="${v.manager||''}">
    </div>
  </td>
  <td><input type="text" class="ci" id="custId_${uid}" placeholder="10位数字" maxlength="10" value="${v.custId||''}" oninput="valCustId('${uid}')"></td>
  <td><input type="text" class="ci" id="custName_${uid}" placeholder="姓名" value="${v.custName||''}"></td>
  <td><input type="number" class="ci" id="aum_${uid}" placeholder="0.00" step="0.01" value="${v.aum||''}"></td>
  <td><input type="number" class="ci" id="res_${uid}" placeholder="0.00" step="0.01" value="${v.res||''}" oninput="calcPost('${uid}')"></td>
  <td><input type="number" class="ci" id="post_${uid}" placeholder="自动" step="0.01" value="${v.post||''}"></td>
  <td><div class="rc">
    <label><input type="radio" name="isnew_${uid}" value="是" ${isNewV==='是'?'checked':''}>是</label>
    <label><input type="radio" name="isnew_${uid}" value="否" ${isNewV==='否'?'checked':''}>否</label>
  </div></td>
  <td><input type="date" class="ci" id="sdate_${uid}" value="${v.sdate||''}"></td>
  <td><input type="text" class="ci" id="rmk_${uid}" placeholder="客户情况" value="${v.rmk||''}"></td>
  <td><button onclick="delRow('${uid}','${pid}')" style="background:none;border:none;cursor:pointer;color:var(--ink3);font-size:15px;padding:3px 5px;">×</button></td>`;
}

function wireRow(uid,pid){
  const els=document.querySelectorAll(`#row_${uid} input, #row_${uid} select`);
  els.forEach(el=>el.addEventListener('change',()=>autosave(pid)));
  els.forEach(el=>el.addEventListener('input',()=>autosave(pid)));
}

function selCell(type,uid,val){
  document.getElementById(`${type}D_${uid}`).value=val;
  document.getElementById(`${type}_${uid}`).value=val;
  document.getElementById(`${type}DL_${uid}`).classList.remove('open');
  if(val==='其他机构'||val==='其他人员') showOther(type,uid);
  else removeOther(type,uid);
  autosave(document.getElementById('row_'+uid)?.dataset?.pid||'');
}

function showOther(type,uid){
  if(document.getElementById(`otherRow_${type}_${uid}`)) return;
  const mainRow=document.getElementById('row_'+uid);
  if(!mainRow) return;
  const tr=document.createElement('tr');
  tr.id=`otherRow_${type}_${uid}`;
  tr.className='other-row';
  const lbl=type==='branch'?'其他机构名称：':'其他人员姓名：';
  tr.innerHTML=`<td></td><td colspan="11"><span class="other-lbl">${lbl}</span><input type="text" class="ci" id="otherV_${type}_${uid}" placeholder="填写具体名称" style="width:180px;display:inline-block;" oninput="updateOther('${type}','${uid}')"></td>`;
  mainRow.after(tr);
}
function removeOther(type,uid){
  const r=document.getElementById(`otherRow_${type}_${uid}`);
  if(r) r.remove();
}
function updateOther(type,uid){
  const val=document.getElementById(`otherV_${type}_${uid}`).value.trim();
  document.getElementById(`${type}D_${uid}`).value=val?`其他：${val}`:(type==='branch'?'其他机构':'其他人员');
  document.getElementById(`${type}_${uid}`).value=val||'';
  if(val) pendAdd(type,val);
}
function pendAdd(type,val){
  if(!val) return;
  const k=type==='branch'?'pendBranches':'pendManagers';
  const arr=lsj(k)||[];
  if(!arr.includes(val)) arr.push(val);
  lsj(k,arr);
  promotePending();
}
function promotePending(){
  const today=todayKey();
  const prev=ls('pendDate');
  if(prev&&prev!==today){
    ['pendBranches','pendManagers'].forEach(k=>{
      const arr=lsj(k)||[];
      if(arr.length){
        const ek=k==='pendBranches'?'extraBranches':'extraManagers';
        const ex=lsj(ek)||[];
        arr.forEach(v=>{if(!ex.includes(v)) ex.push(v);});
        lsj(ek,ex);
        localStorage.removeItem(k);
      }
    });
  }
  ls('pendDate',today);
}

function valCustId(uid){
  const el=document.getElementById('custId_'+uid);
  const v=el.value.replace(/\D/g,'');
  el.value=v;
  el.classList.toggle('err',v.length>0&&v.length!==10);
}
function calcPost(uid){
  const a=parseFloat(document.getElementById('aum_'+uid).value)||0;
  const r=parseFloat(document.getElementById('res_'+uid).value)||0;
  if(a>0||r>0) document.getElementById('post_'+uid).value=(a+r).toFixed(2);
}
function delRow(uid,pid){
  ['row_','otherRow_branch_','otherRow_manager_'].forEach(p=>{
    const el=document.getElementById(p+uid);
    if(el) el.remove();
  });
  updateRcount(pid);
  autosave(pid);
}
function updateRcount(pid){
  const tbody=document.getElementById('tbody_'+pid);
  if(!tbody) return;
  const cnt=tbody.querySelectorAll('tr:not(.other-row)').length;
  const el=document.getElementById('rcount_'+pid);
  if(el) el.textContent=`共 ${cnt} 行`;
}

// ═══════════════════════════════════════════════════
//  AUTOSAVE
// ═══════════════════════════════════════════════════
let asTimers={};
function autosave(pid){
  if(!pid) return;
  clearTimeout(asTimers[pid]);
  asTimers[pid]=setTimeout(()=>{
    const rows=collectRows(pid);
    lsj('rows_'+currentManager+'_'+pid+'_'+todayKey(),rows);
  },600);
}
function collectRows(pid){
  const rows=[];
  const tbody=document.getElementById('tbody_'+pid);
  if(!tbody) return rows;
  tbody.querySelectorAll('tr:not(.other-row)').forEach(tr=>{
    const uid=tr.dataset.uid;
    if(!uid) return;
    const isnew=document.querySelector(`input[name="isnew_${uid}"]:checked`);
    rows.push({
      branch:document.getElementById('branch_'+uid)?.value||'',
      manager:document.getElementById('manager_'+uid)?.value||'',
      custId:document.getElementById('custId_'+uid)?.value||'',
      custName:document.getElementById('custName_'+uid)?.value||'',
      aum:document.getElementById('aum_'+uid)?.value||'',
      res:document.getElementById('res_'+uid)?.value||'',
      post:document.getElementById('post_'+uid)?.value||'',
      isNew:isnew?isnew.value:'',
      sdate:document.getElementById('sdate_'+uid)?.value||'',
      rmk:document.getElementById('rmk_'+uid)?.value||'',
    });
  });
  return rows;
}

// ═══════════════════════════════════════════════════
//  SUBMIT
// ═══════════════════════════════════════════════════
function doSubmit(){
  if(isClosed){showToast('今日收集已结束','err');return;}
  if(products.length===0){showToast('请等待管理员配置产品名称','err');return;}

  let hasErr=false;
  let totalFilled=0;

  products.forEach(prod=>{
    const tbody=document.getElementById('tbody_'+prod.id);
    if(!tbody) return;
    tbody.querySelectorAll('tr:not(.other-row)').forEach(tr=>{
      const uid=tr.dataset.uid;
      if(!uid) return;
      const hasData=['branch','custId','custName','aum','res'].some(f=>{
        const el=document.getElementById(f+'_'+uid)||document.getElementById(f+'D_'+uid);
        return el&&el.value.trim();
      });
      if(!hasData) return;
      totalFilled++;
      // Validate
      ['branch','manager','custId','custName','aum','res','post'].forEach(f=>{
        const el=document.getElementById(f+'_'+uid)||document.getElementById(f+'D_'+uid);
        if(el&&!el.value.trim()){el.classList.add('err');hasErr=true;}
      });
      const custEl=document.getElementById('custId_'+uid);
      if(custEl&&custEl.value&&custEl.value.length!==10){custEl.classList.add('err');hasErr=true;}
      if(!document.querySelector(`input[name="isnew_${uid}"]:checked`)){hasErr=true;}
    });
  });

  if(totalFilled===0){showToast('请至少填写一行数据','err');return;}
  if(hasErr){showToast('请修正标红的错误项（客户号需为10位数字）','err');return;}

  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='提 交 中…';

  const payload={
    type:'submit',
    date:todayKey(),
    submitter:currentManager,
    products:products.map(p=>({
      id:p.id,
      name:p.name,
      rows:collectRows(p.id).filter(r=>r.branch||r.custId||r.custName)
        .map(r=>({...r,submitter:currentManager}))
    }))
  };

  const url = getGasUrl();
  if(!url){
    showToast('⚠ 请在管理员设置中填入 Apps Script URL','err');
    btn.disabled=false; btn.textContent='提 交 数 据'; return;
  }

  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(()=>{showToast('✓ 数据提交成功！','ok');products.forEach(p=>autosave(p.id));})
    .catch(()=>{showToast('✓ 数据已发送','ok');products.forEach(p=>autosave(p.id));})
    .finally(()=>{btn.disabled=false;btn.textContent='提 交 数 据';});
}

// ═══════════════════════════════════════════════════
//  CLOSED STATE
// ═══════════════════════════════════════════════════
function setClosed(v){
  isClosed=v;
  if(v){
    ls('closedDate',todayKey());
    document.getElementById('bannerClosed').style.display='block';
    document.getElementById('bannerWaiting').style.display='none';
    const b=document.getElementById('submitBtn');
    if(b) b.disabled=true;
    const d=document.getElementById('sDot');
    d.className='status-dot closed';
    document.getElementById('sTxt').textContent='已截止';
  }
}

function triggerSend(mode){
  const url=getGasUrl();
  const email=ls('adminEmail')||'';
  if(!url) return;
  const prods=lsj('todayProducts')||[];
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type:mode==='manual'?'manual_cutoff':'daily_cutoff',date:todayKey(),email,products:prods})
  }).catch(()=>{});
  ls('closedDate',todayKey());
  setClosed(true);
}

// ═══════════════════════════════════════════════════
//  ADMIN
// ═══════════════════════════════════════════════════
let adminProdsTemp=[];

function openAdmin(){
  document.getElementById('adminOverlay').classList.add('open');
  adminProdsTemp=[...products];
  renderAdminProdList();
  // Show current URL: prefer localStorage override, fallback to CFG
  const su=ls('gasUrl')||CFG.GAS_URL;
  if(su) document.getElementById('aGasUrl').value=su;
  const se=ls('adminEmail');
  if(se) document.getElementById('aEmail').value=se;
}
function closeAdmin(){document.getElementById('adminOverlay').classList.remove('open');}

function checkAdminAuth(){
  const p=document.getElementById('aPwd').value;
  if(p!==CFG.adminPwd){document.getElementById('aSt').textContent='密码错误';return false;}
  return true;
}

function renderAdminProdList(){
  const list=document.getElementById('prodList');
  list.innerHTML='';
  adminProdsTemp.forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='prod-item';
    div.innerHTML=`<span>${i+1}. ${p.name}</span><button onclick="adminRemoveProd(${i})" title="删除">×</button>`;
    list.appendChild(div);
  });
  if(adminProdsTemp.length===0) list.innerHTML='<p style="font-size:12px;color:var(--ink3);padding:8px 0;">暂无产品，请添加</p>';
}

function adminAddProduct(){
  if(!checkAdminAuth()) return;
  const inp=document.getElementById('newProdInput');
  const name=inp.value.trim();
  if(!name){showToast('请输入产品名称','err');return;}
  // Check duplicate
  if(adminProdsTemp.some(p=>p.name===name)){showToast('产品名称已存在','err');return;}
  adminProdsTemp.push({name,id:'prod_'+Date.now()});
  inp.value='';
  renderAdminProdList();
}

function adminRemoveProd(idx){
  if(!checkAdminAuth()) return;
  adminProdsTemp.splice(idx,1);
  renderAdminProdList();
}

function adminSaveProducts(){
  if(!checkAdminAuth()) return;
  if(adminProdsTemp.length===0){
    document.getElementById('aSt').textContent='请至少添加一个产品';return;
  }
  products=[...adminProdsTemp];
  lsj('todayProducts',products);
  ls('productsDate',todayKey());
  // Notify backend
  const notifyUrl = getGasUrl();
  if(notifyUrl){
    fetch(notifyUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'set_products',date:todayKey(),products})
    }).catch(()=>{});
  }
  document.getElementById('aSt').textContent='✓ 产品配置已保存，客户经理现在可以填写';
  updateBanners();
  if(currentManager&&document.getElementById('page2').classList.contains('active')){
    rowCounters={};
    buildProductsArea();
  }
}

function adminSaveConfig(){
  if(!checkAdminAuth()) return;
  const url=document.getElementById('aGasUrl').value.trim();
  const email=document.getElementById('aEmail').value.trim();
  if(url) { ls('gasUrl',url); CFG.GAS_URL=url; }
  if(email) ls('adminEmail',email);
  document.getElementById('aSt').textContent='✓ 配置已保存';
}

function adminForceClose(){
  if(!checkAdminAuth()) return;
  if(products.length===0){document.getElementById('aSt').textContent='今日尚无产品配置，无需发送';return;}
  document.getElementById('aSt').textContent='正在触发汇总发送…';
  triggerSend('manual');
  setTimeout(()=>document.getElementById('aSt').textContent='✓ 已结束收集并触发汇总发送',800);
}

function adminReopen(){
  if(!checkAdminAuth()) return;
  isClosed=false;
  localStorage.removeItem('closedDate');
  document.getElementById('bannerClosed').style.display='none';
  const btn=document.getElementById('submitBtn');
  if(btn) btn.disabled=products.length===0;
  document.getElementById('sDot').className='status-dot';
  document.getElementById('sTxt').textContent='收集中';
  document.getElementById('aSt').textContent='✓ 已重新开放填写';
}

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(type?' '+type:'');
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>t.classList.remove('show'),3500);
}
</script>
